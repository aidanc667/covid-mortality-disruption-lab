[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5FF"
textColor = "#1E1B2E"
borderColor = "#E2E1F0"
linkColor = "#4F46E5"

redColor = "#DC2626"
orangeColor = "#EA580C"
yellowColor = "#D97706"
greenColor = "#059669"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#6B7280"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "19px", "16px", "14px", "13px"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
linkUnderline = false

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

# Consistent per-cause colors across every chart in the app: order matches
# TEST_CAUSES + NEGATIVE_CONTROL in app/components/data_loading.py, so a
# cause always renders the same hue everywhere it appears.
chartCategoricalColors = [
    "#DC2626",
    "#2563EB",
    "#7C3AED",
    "#EA580C",
    "#059669",
    "#DB2777",
    "#64748B",
]
chartSequentialColors = [
    "#FFF7ED",
    "#FFEDD5",
    "#FED7AA",
    "#FDBA74",
    "#FB923C",
    "#F97316",
    "#EA580C",
    "#C2410C",
    "#9A3412",
    "#7C2D12",
]

dataframeBorderColor = "#E2E1F0"
dataframeHeaderBackgroundColor = "#F5F5FF"

[theme.sidebar]
backgroundColor = "#1E1B2E"
secondaryBackgroundColor = "#2D2846"
textColor = "#F3F2FA"
borderColor = "#3D3660"
primaryColor = "#818CF8"
