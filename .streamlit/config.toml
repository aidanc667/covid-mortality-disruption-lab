[theme]
base = "light"
primaryColor = "#2C5D86"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#15212B"
borderColor = "#D5DCE3"
linkColor = "#2C5D86"

redColor = "#B3261E"
orangeColor = "#C26A2E"
yellowColor = "#8A6D3B"
greenColor = "#2F6F4E"
blueColor = "#2C5D86"
violetColor = "#7A5C99"
grayColor = "#5A6875"

font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "26px", "20px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false

baseRadius = "4px"
buttonRadius = "3px"
showWidgetBorder = true
showSidebarBorder = false

# Per-cause colors in TEST_CAUSES + NEGATIVE_CONTROL order (heart, diabetes,
# Alzheimer's, stroke, overdose, cancer, congenital), identical to CAUSE_COLORS
# in app/components/data_loading.py. Cause-colored charts still pass
# CAUSE_COLORS as an explicit scale; see the comment there.
chartCategoricalColors = [
    "#C26A2E",
    "#B3261E",
    "#8A6D3B",
    "#7A5C99",
    "#2C5D86",
    "#2F6F4E",
    "#8795A3",
]
chartSequentialColors = [
    "#FFF7ED",
    "#FFEDD5",
    "#FED7AA",
    "#FDBA74",
    "#FB923C",
    "#F97316",
    "#EA580C",
    "#C2410C",
    "#9A3412",
    "#7C2D12",
]

dataframeBorderColor = "#D5DCE3"
dataframeHeaderBackgroundColor = "#EEF2F6"

[theme.sidebar]
backgroundColor = "#15212B"
secondaryBackgroundColor = "#2A3947"
textColor = "#E6EBF0"
borderColor = "#2A3947"
primaryColor = "#8FB3D9"
linkColor = "#AAB6C2"
