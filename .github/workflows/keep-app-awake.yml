name: Keep Streamlit app awake

# Streamlit Community Cloud puts an app to sleep after 12 hours with no
# traffic. Every 6 hours gives comfortable margin under that threshold
# even if a run is delayed (GitHub does not guarantee exact cron timing
# under load). workflow_dispatch allows a manual run from the Actions
# tab, e.g. to test this after changing it.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python .github/scripts/keep_app_awake.py
